name: Release

# Builds versioned cw/cmdwarden-agent packages for Linux (this project's only
# supported OS — it depends on systemd --user, D-Bus, and pacman/mise
# provenance, none of which exist elsewhere).
#
# Push a tag matching v*.*.* to build and publish a GitHub Release with the
# packaged tarballs attached. Or run this workflow manually (Actions tab ->
# Release -> Run workflow) to build the same artifacts without publishing a
# release — useful for testing the packaging itself before cutting a tag.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version string to embed in the binaries (e.g. v0.1.0-test). Only used for a manual run; a tag push always uses the tag itself."
        required: false
        default: "v0.0.0-manual"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          ldflags="-s -w -X github.com/BasantPandey/CmdWarden-Omarchy/internal/version.Version=${{ steps.version.outputs.version }} -X github.com/BasantPandey/CmdWarden-Omarchy/internal/version.Commit=${{ github.sha }}"
          go build -trimpath -ldflags "$ldflags" -o dist/cw ./cmd/cw
          go build -trimpath -ldflags "$ldflags" -o dist/cmdwarden-agent ./cmd/cmdwarden-agent

      - name: Package
        id: package
        run: |
          name="cmdwarden-omarchy-${{ steps.version.outputs.version }}-linux-${{ matrix.goarch }}"
          mkdir -p "$name"
          cp dist/cw dist/cmdwarden-agent README.md "$name"/
          tar -czf "${name}.tar.gz" "$name"
          sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            ${{ steps.package.outputs.name }}.tar.gz
            ${{ steps.package.outputs.name }}.tar.gz.sha256
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" artifacts/*.tar.gz artifacts/*.tar.gz.sha256 \
            --repo "${{ github.repository }}" \
            --title "$tag" \
            --generate-notes
